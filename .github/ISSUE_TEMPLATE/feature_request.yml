name: 機能リクエスト
description: 新しい機能や、今の機能の改善を提案します
labels: ["enhancement"]
body:
  - type: textarea
    id: body
    attributes:
      label: 提案内容
      value: |
        - [ ] 類似の機能提案がすでに存在しないか確認しました。
        ### この機能リクエストは、何らかの問題に関連していますか？具体的に説明してください。
        > どのような問題があるのか​​、明確かつ簡潔に説明してください。（例：〜の際にいつも不便を感じている、など）

        ### どのような解決策を希望しますか？
        > どのような状態になってほしいか、明確かつ簡潔に説明してください。

        ### 補足情報
        > この機能リクエストに関するその他の背景情報や、スクリーンショットなどがあればこちらに追加してください。
    validations:
      required: true
