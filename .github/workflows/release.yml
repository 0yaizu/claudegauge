name: Release

# GitHub でリリース (pre-release を含む) を公開したときに、ビルドして、そのリリースに zip を添付する。
# リリースノートは、リリースを作るときに手動で用意する。
#   安定版: v0.1.0 / 先行版: pre-v0.0.1, beta-v0.0.1
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # リリースにファイルを添付する
      id-token: write # ビルドの由来の証明 (attestation) の署名
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: タグ名を検査してバージョンを決める
        run: |
          if [[ ! "$TAG" =~ ^(v|pre-v|beta-v)([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "タグ名は v1.2.3 / pre-v1.2.3 / beta-v1.2.3 の形にしてください: $TAG" >&2
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: main に含まれるコミットか確認
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "このコミットは main に含まれていません。main の履歴からリリースしてください。" >&2
            exit 1
          fi

      - name: ツールのバージョンを表示
        run: |
          xcodebuild -version
          swift --version

      - name: テスト
        run: swift test

      - name: ビルド
        run: ./scripts/bundle.sh

      - name: arm64 だけのバイナリであることを確認
        run: |
          archs="$(lipo -archs build/ClaudeGauge.app/Contents/MacOS/ClaudeGauge)"
          echo "archs: $archs"
          [[ "$archs" == "arm64" ]]

      - name: zip とチェックサムを作成
        run: |
          zip_name="ClaudeGauge-${TAG}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/ClaudeGauge.app "$zip_name"
          shasum -a 256 "$zip_name" > "$zip_name.sha256"
          cat "$zip_name.sha256"
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: zip を展開しても署名が有効なことを確認
        run: |
          verify_dir="$(mktemp -d)"
          ditto -x -k "$ZIP_NAME" "$verify_dir"
          codesign --verify --strict --deep "$verify_dir/ClaudeGauge.app"

      - name: ビルドの由来の証明 (attestation)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ClaudeGauge-*.zip

      # 失敗して再実行したときのために、同名のファイルは上書きする。
      - name: リリースに添付
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
